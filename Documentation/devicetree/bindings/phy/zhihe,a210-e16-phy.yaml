%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/zhihe,a210-e16-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 Synopsys E16 shared PCIe PHY

maintainers:
  - Han Gao <gaohan@iscas.ac.cn>

description: |
  Two analog PHY banks share lane routing and resistance calibration.
  Both PCIe root ports use the same PHY so initialization and clocks
  remain active until the last consumer releases it. SATA lanes may be
  reserved by the routing configuration; this binding describes the
  PCIe consumers of the shared block.

properties:
  compatible:
    const: zhihe,a210-e16-phy

  reg:
    items:
      - description: Common control registers
      - description: First analog PHY bank
      - description: Second analog PHY bank

  reg-names:
    items:
      - const: sysreg
      - const: phy0
      - const: phy1

  clocks:
    items:
      - description: APB register clock
      - description: External 100 MHz reference clock

  clock-names:
    items:
      - const: apb
      - const: ref

  resets:
    items:
      - description: APB interface reset
      - description: Common PHY reset

  reset-names:
    items:
      - const: apb
      - const: phy

  '#phy-cells':
    const: 0

  data-lanes:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: |
      Destination of each of the four physical lanes, in lane order.
      0 is unused, 1 is PCIe port 0, 2 is PCIe port 1, and 3 and 4 are
      SATA ports 0 and 1. Supported routings are <1 1 1 1>, <1 1 2 0>,
      <1 1 3 4> and <1 2 3 4>.
    minItems: 4
    maxItems: 4
    items:
      minimum: 0
      maximum: 4

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - '#phy-cells'
  - data-lanes

additionalProperties: false

examples:
  - |
    phy@a180000 {
        compatible = "zhihe,a210-e16-phy";
        reg = <0xa180000 0x1000>, <0xa100000 0x40000>,
              <0xa140000 0x40000>;
        reg-names = "sysreg", "phy0", "phy1";
        clocks = <&pcie_clk 0>, <&pcie_ref>;
        clock-names = "apb", "ref";
        resets = <&pcie_rst 0>, <&pcie_rst 1>;
        reset-names = "apb", "phy";
        #phy-cells = <0>;
        data-lanes = <1 2 3 4>;
    };
...
