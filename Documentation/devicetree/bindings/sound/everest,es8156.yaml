%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/everest,es8156.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Everest Semiconductor ES8156 stereo DAC

maintainers:
  - Han Gao <gaohan@iscas.ac.cn>

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: everest,es8156
  reg:
    maxItems: 1
  avdd-supply:
    description: Analog power supply.
  dvdd-supply:
    description: Digital core power supply.
  pvdd-supply:
    description: Digital interface power supply.
  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - avdd-supply
  - dvdd-supply
  - pvdd-supply
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        codec@8 {
            compatible = "everest,es8156";
            reg = <8>;
            avdd-supply = <&vdd_3v3>;
            dvdd-supply = <&vdd_1v8>;
            pvdd-supply = <&vdd_1v8>;
            #sound-dai-cells = <0>;
        };
    };
...
