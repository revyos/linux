%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/zhihe/zhihe,a210-peri-ctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Zhihe A210 peripheral control registers

maintainers:
  - Han Gao <gaohan@iscas.ac.cn>

description:
  Peripheral subsystem control registers contain I2S enable and status
  bits, and CAN low-power controls. Clock gates and resets are separate
  register banks.

properties:
  compatible:
    items:
      - const: zhihe,a210-peri2-ctrl
      - const: syscon
  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@8400000 {
        compatible = "zhihe,a210-peri2-ctrl", "syscon";
        reg = <0x8400000 0x8>;
    };
...
